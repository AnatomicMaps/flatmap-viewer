<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, proxy-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="shortcut icon" href="/static/icons/favicon.ico">
    <style type="text/css">
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        font-family: sans-serif;
        font-size: small;
        overflow: hidden;
        font: 10pt "Helvetica Neue", Arial, Helvetica, sans-serif;
      }
      .top-bar {
        padding: 10px;
        padding-bottom: 0;
      }
      .draw-update {
        float: right;
      }
      #drawing-id {
        padding-right: 10px;
      }
      .selector {
        width: 220px;
        margin-left: 4px;
      }
      #map-selector {
        width: 280px;
      }
      #generation-selection {
        margin-left: 20px;
      }
      #server-selection {
        float: right;
      }
      /* NB. MapLibre sets ``position: absolute`` of the map's canvas regardless
          of what we set, so let's set it for initial rendering...
       */
      #flatmap-viewer-canvas {
        border: 1px solid black;
        position: absolute;
        left: 7px;
        right: 7px;
        top: 34px;
        bottom: 7px;
      }
      .flatmap-viewer-pane {
        position: relative !important;
        width: 100%;
        border: 2px solid darkgreen;
      }

      #provenance-display {
        border: 1px solid black;
        position: absolute;
        left: 7px;
        right: 7px;
        top: 86vh;
        bottom: 7px;
        overflow: scroll;
        padding: 2px;
        display: none;
      }
      .provenance.outermost {
        margin-bottom: 4px;
      }
      span.spacer {
        min-width: 16px;
        display: inline-block;
      }
      span.prompt {
        font-weight: bold;
        min-width: 100px;
        display: inline-block;
      }

      .resizer[data-direction='horizontal'] {
        background-color: red;
        cursor: ew-resize;
        height: 100%;
        width: 3px !important;
      }
      .resizer[data-direction='vertical'] {
        background-color: red;
        cursor: ns-resize;
        height: 3px !important;
        width: 100%;
      }
      #metrics {
        position: absolute;
        top: 44px;
        left: 17px;
        background: #eee;
        padding: 10px 14px;
        border-radius: .4rem;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 100;
      }
      #metrics div { margin: 4px 0; }
      #metrics span { font-weight: bold; }
    </style>
  </head>
  <body>
    <div>
      <div class='top-bar'>
        <span>
          <label for="map-selector">Select map:</label>
          <select id="map-selector" class="selector"></select>
        </span>
        <span id="generation-selection">
          <label for="map-generation">Version:</label>
          <select id="map-generation" class="selector"></select>
        </span>
        <span id="server-selection">
          <label for="server-selector">Map server:</label>
          <select id="server-selector" class="selector"></select>
        </span>
      </div>
      <div id="metrics">
          <div>Load: <span id="map-load">—</span></div>
      </div>
      <div id="content">
        <div id="flatmap-viewer-canvas"></div>
        <div id="provenance-display"></div>
      </div>
    </div>
  </body>
  <script type="module" src="index.ts"></script>
</html>
